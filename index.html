<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Personal calorie tracker">
  <meta name="theme-color" content="#f3f0e8">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="David Tracker">
  <title>David Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var themes = { light: "#f6f5f2", dark: "#121212", blue: "#0b1220", green: "#0c1410", warm: "#1a1410" };
      var saved = localStorage.getItem("calorie-tracker-theme");
      if (!themes[saved]) saved = "light";
      document.documentElement.dataset.theme = saved;
      var theme = document.querySelector('meta[name="theme-color"]');
      if (theme) theme.content = themes[saved];
    })();
  </script>
</head>
<body>
  <div id="app">
    <p class="boot">Loading…</p>
  </div>
  <noscript><p class="boot">Turn on JavaScript to use the calorie tracker.</p></noscript>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
