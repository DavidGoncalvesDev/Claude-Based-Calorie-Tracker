<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f5f2">
  <title>Sign in · Tracker</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login">
    <div class="card login-card">
      <img class="logo" src="icons/Logo.png" alt="" width="40" height="40">
      <h1>Tracker</h1>
      <p id="lead">Checking this browser…</p>
      <form class="stack" id="email-form" hidden autocomplete="on">
        <label class="field"><span>Email</span><input id="email" name="email" type="email" autocomplete="email" required></label>
        <button class="primary" id="send" type="submit">Continue</button>
      </form>
      <p class="hint" id="status"></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script>
    const CONNECT = "https://davidpersonaltracker.netlify.app/connect.html";
    const status = document.getElementById("status");
    const lead = document.getElementById("lead");
    const form = document.getElementById("email-form");
    const params = new URLSearchParams(location.search);
    const message = params.get("message");
    const requestId = params.get("request") || sessionStorage.getItem("calorie-request");
    if (requestId) sessionStorage.setItem("calorie-request", requestId);
    if (message) status.textContent = message;
    if (!requestId && !params.get("code")) {
      form.hidden = true;
      lead.textContent = message || "Close this page and connect again from Claude.";
    }
    const client = window.supabase.createClient("https://eurqqiebokwcrrhfbihg.supabase.co", "sb_publishable_IYwulskgj7ReZdjiyPa63A_pWxKYXn7", {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });
    async function finish(session) {
      const saved = sessionStorage.getItem("calorie-request");
      if (!saved) {
        lead.textContent = "This page lost the Claude connection. Close it and connect again from Claude, on this device.";
        status.textContent = "";
        return;
      }
      const response = await fetch("https://eurqqiebokwcrrhfbihg.supabase.co/functions/v1/calorie-mcp/mint", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ access_token: session.access_token, request_id: saved }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok || !body.redirect) {
        lead.textContent = body.message || "Could not finish connecting. Close this page and try again from Claude.";
        status.textContent = "";
        return;
      }
      sessionStorage.removeItem("calorie-request");
      location.replace(body.redirect);
    }
    client.auth.getSession().then(({ data }) => {
      if (!requestId && !params.get("code")) return;
      if (data.session) {
        form.hidden = true;
        lead.textContent = "This browser is already signed in. Connecting Claude to that account. No email is sent.";
        status.textContent = "";
        finish(data.session);
        return;
      }
      form.hidden = false;
      lead.textContent = "This browser is not signed in. Enter the email for your account. A message goes to that inbox, and you open it here.";
    });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const button = document.getElementById("send");
      button.disabled = true;
      lead.textContent = "Sending a message to that inbox.";
      status.textContent = "";
      const { error } = await client.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: CONNECT, shouldCreateUser: true },
      });
      button.disabled = false;
      status.textContent = error
        ? (/rate limit/i.test(error.message)
          ? "Too many messages were sent. Wait about an hour, then press Continue once."
          : "Check the email and try again.")
        : "Open the message sent to that inbox, on this device.";
    });
  </script>
</body>
</html>
