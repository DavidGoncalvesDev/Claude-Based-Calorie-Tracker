<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Connect Claude</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f5f2; color: #1c1917; font-family: system-ui, sans-serif; }
    main { width: min(28rem, calc(100% - 32px)); }
    h1 { font-size: 1.4rem; margin-bottom: 0.4rem; }
    form { display: grid; gap: 12px; margin-top: 16px; }
    input, button { font: inherit; padding: 12px; }
    button { font-weight: 700; }
    .error { color: #9b2c2c; }
  </style>
</head>
<body>
  <main>
    <h1>Connect your email</h1>
    <p id="status">Use the same email you use on the website.</p>
    <form id="email-form">
      <label>Email<br><input id="email" type="email" autocomplete="email" required></label>
      <button id="send" type="submit">Email me a sign-in link</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script>
    const CONNECT = "https://davidpersonaltracker.netlify.app/connect.html";
    const status = document.getElementById("status");
    const form = document.getElementById("email-form");
    const params = new URLSearchParams(location.search);
    const message = params.get("message");
    const requestId = params.get("request") || sessionStorage.getItem("calorie-request");
    if (requestId) sessionStorage.setItem("calorie-request", requestId);
    if (message) status.textContent = message;
    if (!requestId && !params.get("code")) {
      form.hidden = true;
      if (!message) status.textContent = "Close this page and connect again from Claude.";
    }
    const client = window.supabase.createClient("https://eurqqiebokwcrrhfbihg.supabase.co", "sb_publishable_IYwulskgj7ReZdjiyPa63A_pWxKYXn7", {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });
    async function finish(session) {
      const saved = sessionStorage.getItem("calorie-request");
      if (!saved) {
        status.textContent = "This page lost the Claude connection. Close it and connect again from Claude, on this device.";
        return;
      }
      const response = await fetch("https://eurqqiebokwcrrhfbihg.supabase.co/functions/v1/calorie-mcp/mint", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ access_token: session.access_token, request_id: saved }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok || !body.redirect) {
        status.textContent = body.message || "Could not finish connecting. Close this page and try again from Claude.";
        return;
      }
      sessionStorage.removeItem("calorie-request");
      location.replace(body.redirect);
    }
    client.auth.getSession().then(({ data }) => {
      if (data.session) {
        form.hidden = true;
        status.textContent = "Signing you in…";
        finish(data.session);
      }
    });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const button = document.getElementById("send");
      button.disabled = true;
      status.textContent = "Sending the link…";
      const { error } = await client.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: CONNECT, shouldCreateUser: true },
      });
      button.disabled = false;
      status.textContent = error
        ? "Could not send the email. Check the address and try again."
        : "Check your inbox and open the link on this device.";
    });
  </script>
</body>
</html>
