<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f5f2">
  <title>Sign in · Tracker</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login">
    <div class="card login-card">
      <img class="logo" src="icons/Logo.png" alt="" width="40" height="40">
      <h1>Tracker</h1>
      <p id="lead">Checking this browser…</p>
      <form class="stack" id="username-form" hidden autocomplete="on">
        <label class="field"><span>Username</span><input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <button class="primary" id="send" type="submit">Connect</button>
        <p class="hint">Use the same username you type on the website. No email is sent.</p>
      </form>
      <p class="hint" id="status"></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = "https://eurqqiebokwcrrhfbihg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IYwulskgj7ReZdjiyPa63A_pWxKYXn7";
    const status = document.getElementById("status");
    const lead = document.getElementById("lead");
    const form = document.getElementById("username-form");
    const params = new URLSearchParams(location.search);
    const message = params.get("message");
    const requestId = params.get("request") || sessionStorage.getItem("calorie-request");
    if (requestId) sessionStorage.setItem("calorie-request", requestId);
    if (message) status.textContent = message;
    if (!requestId && !params.get("code")) {
      form.hidden = true;
      lead.textContent = message || "Close this page and connect again from Claude.";
    }
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });
    function isWordAccount(session) {
      return String(session?.user?.email || "").endsWith("@users.calorie-tracker.app");
    }
    async function finish(session) {
      const saved = sessionStorage.getItem("calorie-request");
      if (!saved) {
        lead.textContent = "This page lost the Claude connection. Close it and connect again from Claude, on this device.";
        status.textContent = "";
        return;
      }
      const response = await fetch(`${SUPABASE_URL}/functions/v1/calorie-mcp/mint`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ access_token: session.access_token, request_id: saved }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok || !body.redirect) {
        lead.textContent = body.message || "Could not finish connecting. Close this page and try again from Claude.";
        status.textContent = "";
        return;
      }
      sessionStorage.removeItem("calorie-request");
      location.replace(body.redirect);
    }
    async function openWord(word) {
      const response = await fetch(`${SUPABASE_URL}/functions/v1/codename-auth`, {
        method: "POST",
        headers: { "content-type": "application/json", apikey: SUPABASE_KEY },
        body: JSON.stringify({ username: word }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok || !body.access_token || !body.refresh_token) {
        throw new Error(body.message || "Could not open that username. Try again.");
      }
      const { data, error } = await client.auth.setSession({
        access_token: body.access_token,
        refresh_token: body.refresh_token,
      });
      if (error || !data.session) throw new Error("Could not open that username. Try again.");
      return data.session;
    }
    client.auth.getSession().then(({ data }) => {
      if (!requestId && !params.get("code")) return;
      if (data.session && isWordAccount(data.session)) {
        form.hidden = true;
        lead.textContent = "This browser is already open on a username. Connecting Claude to that username.";
        status.textContent = "";
        finish(data.session);
        return;
      }
      form.hidden = false;
      lead.textContent = "Type the username for this account. Claude saves meals onto that username, and the website opens the same username.";
    });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const word = document.getElementById("username").value.trim();
      const button = document.getElementById("send");
      if (!/^[A-Za-z][A-Za-z0-9]{2,31}$/.test(word)) {
        status.textContent = "Use a username of 3 to 32 letters or numbers, starting with a letter.";
        return;
      }
      button.disabled = true;
      lead.textContent = "Opening that username.";
      status.textContent = "";
      try {
        const session = await openWord(word);
        form.hidden = true;
        lead.textContent = "Connecting Claude to that username.";
        await finish(session);
      } catch (error) {
        button.disabled = false;
        lead.textContent = "Type the username for this account. Claude saves meals onto that username, and the website opens the same username.";
        status.textContent = error instanceof Error && error.message
          ? error.message
          : "Could not open that username. Try again.";
      }
    });
  </script>
</body>
</html>
